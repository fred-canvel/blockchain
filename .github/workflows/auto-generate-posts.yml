name: Auto Generate Blog Posts

on:
  schedule:
    # Publicación diaria: 1 vez al día
    
    # 12:00 EST (17:00 UTC) - Mitad de sesión NY / Actualización mediodía
    - cron: '0 17 * * *'
  
  # Permite ejecutar manualmente desde GitHub
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate new blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate-post
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated blog post - $(date +'%Y-%m-%d %H:%M')" && git push)
