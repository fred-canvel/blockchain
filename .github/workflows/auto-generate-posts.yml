name: Auto Generate Blog Posts

on:
  schedule:
    # Estrategia de publicación: 5 veces al día para cubrir sesiones globales y volatilidad.
    
    # 00:00 EST (05:00 UTC) - Inicio de jornada / Cierre previo
    - cron: '0 5 * * *'
    
    # 08:00 EST (13:00 UTC) - Pre-mercado Nueva York (Alta relevancia)
    - cron: '0 13 * * *'
    
    # 12:00 EST (17:00 UTC) - Mitad de sesión NY / Actualización mediodía
    - cron: '0 17 * * *'
    
    # 16:00 EST (21:00 UTC) - Cierre mercado NY / Resumen jornada
    - cron: '0 21 * * *'
    
    # 20:00 EST (01:00 UTC) - Apertura mercados asiáticos (Volatilidad nocturna)
    - cron: '0 1 * * *'
  
  # Permite ejecutar manualmente desde GitHub
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate new blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate-post
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated blog post - $(date +'%Y-%m-%d %H:%M')" && git push)
